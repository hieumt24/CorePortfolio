name: Backend CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: backend/**/*.csproj
        
    - name: Restore dependencies
      run: |
        dotnet restore src/CorePortfolio.API/CorePortfolio.API.csproj
        dotnet restore src/CorePortfolio.Domain.Tests/CorePortfolio.Domain.Tests.csproj
        dotnet restore src/CorePortfolio.API.IntegrationTests/CorePortfolio.API.IntegrationTests.csproj
      
    - name: Build
      run: dotnet build src/CorePortfolio.API/CorePortfolio.API.csproj --configuration Release --no-restore

    - name: Run domain tests
      run: dotnet test src/CorePortfolio.Domain.Tests/CorePortfolio.Domain.Tests.csproj --configuration Release --no-restore --verbosity normal

    - name: Run API integration tests
      run: dotnet test src/CorePortfolio.API.IntegrationTests/CorePortfolio.API.IntegrationTests.csproj --configuration Release --no-restore --verbosity normal

    - name: Verify EF migrations on an empty SQLite database
      run: |
        dotnet tool install --global dotnet-ef --version 10.0.9
        dotnet ef database update \
          --project src/CorePortfolio.Infrastructure/CorePortfolio.Infrastructure.csproj \
          --startup-project src/CorePortfolio.API/CorePortfolio.API.csproj \
          --connection "Data Source=${RUNNER_TEMP}/coreportfolio-ci.db" \
          --configuration Release \
          --no-build
