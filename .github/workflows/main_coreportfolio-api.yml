# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - coreportfolio-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: api-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore backend/src/CorePortfolio.Domain.Tests/CorePortfolio.Domain.Tests.csproj
          dotnet restore backend/src/CorePortfolio.API.IntegrationTests/CorePortfolio.API.IntegrationTests.csproj
          dotnet restore backend/src/CorePortfolio.API/CorePortfolio.API.csproj --runtime linux-x64

      - name: Build with dotnet
        run: dotnet build backend/src/CorePortfolio.API/CorePortfolio.API.csproj --configuration Release --no-restore

      - name: Run domain tests
        run: dotnet test backend/src/CorePortfolio.Domain.Tests/CorePortfolio.Domain.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Run API integration tests
        run: dotnet test backend/src/CorePortfolio.API.IntegrationTests/CorePortfolio.API.IntegrationTests.csproj --configuration Release --no-restore --verbosity normal

      - name: dotnet publish
        run: dotnet publish backend/src/CorePortfolio.API/CorePortfolio.API.csproj -c Release -r linux-x64 --self-contained true --no-restore -o ${{env.DOTNET_ROOT}}/myapp

      - name: Package Linux artifact with executable permissions
        shell: bash
        run: |
          chmod +x ${{env.DOTNET_ROOT}}/myapp/CorePortfolio.API
          tar -C ${{env.DOTNET_ROOT}}/myapp -czf ${{env.DOTNET_ROOT}}/coreportfolio-api.tar.gz .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/coreportfolio-api.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Extract Linux deployment artifact
        shell: bash
        run: |
          mkdir deployment
          tar -xzf coreportfolio-api.tar.gz -C deployment
          chmod +x deployment/CorePortfolio.API
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'coreportfolio-api'
          slot-name: 'Production'
          package: deployment
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_9F0199D64EEA4451A26E9E22CEA11884 }}

      - name: Smoke test production API liveness
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 18 --retry-delay 10 --retry-all-errors \
            https://coreportfolio-api-cdbchffjhtg2hgda.southeastasia-01.azurewebsites.net/health/live

      - name: Check production API readiness
        shell: bash
        run: |
          status=$(curl --silent --show-error --output /tmp/readiness.json --write-out '%{http_code}' --retry 3 --retry-delay 5 https://coreportfolio-api-cdbchffjhtg2hgda.southeastasia-01.azurewebsites.net/health/ready)
          cat /tmp/readiness.json
          if [ "$status" != "200" ]; then
            echo "Warning: API is alive but database readiness returned HTTP $status. Check Azure ConnectionStrings__DefaultConnection and /home/data persistence."
          fi
