# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - coreportfolio-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: api-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore backend/src/CorePortfolio.API/CorePortfolio.API.csproj --runtime linux-x64
          dotnet restore backend/src/CorePortfolio.Domain.Tests/CorePortfolio.Domain.Tests.csproj

      - name: Build with dotnet
        run: dotnet build backend/src/CorePortfolio.API/CorePortfolio.API.csproj --configuration Release --no-restore

      - name: Run domain tests
        run: dotnet test backend/src/CorePortfolio.Domain.Tests/CorePortfolio.Domain.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: dotnet publish
        run: dotnet publish backend/src/CorePortfolio.API/CorePortfolio.API.csproj -c Release -r linux-x64 --self-contained true --no-restore -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'coreportfolio-api'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_9F0199D64EEA4451A26E9E22CEA11884 }}

      - name: Smoke test production API
        shell: bash
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused https://coreportfolio-api-cdbchffjhtg2hgda.southeastasia-01.azurewebsites.net/health
